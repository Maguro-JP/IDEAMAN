[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ideaman"
version = "0.1.0"
description = "自発的にアイデアを生み出し蓄積していくシステム"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
# どれもオプション。Web とワーカーは追加依存なしで動く。
llm = ["anthropic>=0.40"]
bot = ["discord.py>=2.3"]
# 2.x で FastMCP が MCPServer に変わったため 1.x では動かない
mcp = ["mcp>=2.0"]
dev = ["pytest>=8.0", "httpx>=0.27"]

[project.scripts]
ideaman = "ideaman.cli:main"

[tool.setuptools.packages.find]
include = ["ideaman*"]

[tool.setuptools.package-data]
ideaman = ["data/*.yaml", "static/*.html", "*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
