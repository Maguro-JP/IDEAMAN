constraints:
  # 「〜として作り直すとしたら」の前に置く縛り。恣意的であること自体に
  # 意味がある（オズボーン／SCAMPER の制約法）が、**身体や天候の縛りは
  # 抽象的な材料に掛からない**。「立ったままで在庫を扱うとする」は無意味。
  # だから設計上の縛りに言い換えてある。物にも仕組みにも同じように効く。
  - {term: 十秒以内で, domains: [time]}
  - {term: 一人きりで, domains: [social]}
  - {term: 声だけで, domains: [sound, sense]}
  - {term: 予算ゼロで, domains: [economy]}
  - {term: 紙の上だけで, domains: [analog, physical]}
  - {term: 文字を使わずに, domains: [language]}
  - {term: 一日一回だけ, domains: [time, rule]}
  - {term: 見知らぬ人と, domains: [social, trust]}
  - {term: 説明書なしで, domains: [ux, learning]}
  - {term: 三つの部品だけで, domains: [structure]}
  - {term: 元に戻せない形で, domains: [rule, time]}
  - {term: 誰にも見られずに, domains: [trust, identity]}
  - {term: 十年続く前提で, domains: [time]}
  - {term: 子どもにも分かる形で, domains: [learning, language]}
  - {term: 手放すことを前提に, domains: [economy, emotion]}
  # 身体・天候だったものを、設計上の縛りに置き換えたもの
  - {term: 立ったまま終わる速さで, domains: [time, physical]}
  - {term: 調子の悪い日でも回る形で, domains: [rule, nature]}
  - {term: 自動化を一切使わずに, domains: [physical, economy]}
  # 引き継ぎと撤退。作るときに一番考えないが、一番効く縛り
  - {term: いつでも後戻りできる形で, domains: [rule]}
  - {term: 明日引き継ぐ前提で, domains: [social, learning]}
  - {term: 半分の手間で, domains: [economy, ux]}
  - {term: 失敗しても誰も困らない形で, domains: [rule, trust]}

provocations:
  - {term: それは本当に必要か, domains: [rule]}
  - {term: 誰も損をしないか, domains: [social, economy]}
  - {term: 逆に不便にしたらどうなるか, domains: [ux, play]}
  - {term: 百年前ならどうしていたか, domains: [time, culture]}
  - {term: 失われたら誰が困るか, domains: [social, emotion]}
  - {term: なぜ今まで誰もやらなかったのか, domains: [creation]}
  - {term: 最初の一人はどう始めるか, domains: [social, learning]}
  - {term: 途中でやめたらどうなるか, domains: [time, rule]}
  - {term: それを嫌う人は何を守っているのか, domains: [social, emotion]}
  - {term: 数えられないものは何か, domains: [information, mind]}
  - {term: 静かにやる方法はあるか, domains: [sound, social]}
  - {term: 一番安い版はどんな形か, domains: [economy, structure]}

moods:
  - 静穏
  - 挑発
  - 郷愁
  - 実務
  - 夢想
  - 逆説

# --- 以下は「有益さ」のための部品 -------------------------------------
#
# 衝突だけでは警句にしかならない。実際に手が動くには「何の側面を」
# 「まず何で試すか」が要る。この2つが具体性を担う。

# 対象のどの側面をいじるか。漠然と「Xを変える」ではなく側面を名指しする。
aspects:
  # 名詞句。「{aspect}を{操作}」のように動詞の目的語にできる。
  - {term: 順番, domains: [structure]}
  - {term: 頻度, domains: [time]}
  - {term: 入り口, domains: [ux]}
  - {term: 終わり方, domains: [ux]}
  - {term: 待ち時間, domains: [time, ux]}
  - {term: 初期状態, domains: [structure]}
  - {term: 失敗したときの挙動, domains: [rule]}
  - {term: 名前, domains: [language]}
  - {term: 単位, domains: [structure]}
  - {term: 見た目, domains: [art, ux]}
  - {term: 手数, domains: [ux]}
  - {term: 記録の残り方, domains: [memory, information]}
  - {term: 例外の扱い, domains: [rule]}
  - {term: 境界, domains: [structure, space]}
  - {term: 一番よく使う部分, domains: [ux]}
  - {term: 誰も見ていない部分, domains: [structure]}
  - {term: 一番お金がかかっている部分, domains: [economy]}
  - {term: 一番遅いところ, domains: [time]}
  - {term: やり直しのきかない部分, domains: [rule]}
  - {term: 説明が一番長くなる部分, domains: [language, ux]}

  - {term: 誰も使っていない部分, domains: [ux]}

  # 疑問節（kind: clause）。「{material}の◯◯」「{material}で◯◯」の形で
  # 埋め込み疑問になる語。**動詞の目的語にはできない**ので、専用の
  # 問いテンプレート（needs に aspect_q）だけが使う。
  # 構造ではなく力関係と経緯を突くので、問いとしては名詞句より強い。
  - {term: 誰が決めるか, domains: [social, rule], kind: clause}
  - {term: 誰が得をしているか, domains: [social, economy], kind: clause}
  - {term: 誰が損をしているか, domains: [social, economy], kind: clause}
  - {term: 何が一番よく壊れるか, domains: [rule], kind: clause}
  - {term: 何が一番時間を食っているか, domains: [time], kind: clause}
  - {term: なぜ二度手間になっているか, domains: [ux, structure], kind: clause}
  - {term: 何を諦めて今の形になったか, domains: [rule, memory], kind: clause}

# まず何で試すか。30分〜1日で終わる大きさに寄せる。
# アイデアが「良さそうだが動けない」で終わるのを防ぐための欄。
probes:
  - {term: 紙に1枚だけ書いてみる, domains: [analog]}
  - {term: 既存のものを1つ選んで作り替える, domains: [creation]}
  - {term: 1日だけその運用にしてみる, domains: [time]}
  - {term: 一番小さい例で手を動かす, domains: [creation]}
  - {term: 誰か1人に見せて反応を見る, domains: [social]}
  - {term: 逆の状態を作って比べる, domains: [structure]}
  - {term: 5件だけ手で作ってみる, domains: [creation]}
  - {term: 今あるログを見返す, domains: [information]}
  - {term: 15分だけ試して捨てる, domains: [time]}
  - {term: 一番困っている場面を1つ書き出す, domains: [mind]}
