# IDEAMAN 語彙プール
#
# 各語は `term` と `domains`（分野タグ）を持つ。combinator は domains の
# 重なりが少ない組を優先することで、普段結びつかない衝突を作り出す。
# domains が空の語はどの分野とも衝突しうる「自由な語」として扱われる。

