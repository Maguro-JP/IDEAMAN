# アイデアの文型。
#
# 使えるプレースホルダ:
#   {material}    あなたが登録したテーマの材料（例: 通知, 語彙, 会議）
#   {concept_a} {concept_b}  汎用の概念（遠くから持ってくる）
#   {operation} {constraint} {provocation} {aspect} {probe}
#
# tone:
#   proposal … 明日試せる具体策。「何をするか」と「まず何から」が要る
#   question … 見方を変える問い。答えを書かず、前提を疑わせる
#
# 設計方針:
# **警句を書かない。** 「Xは、Yのかたちをしている」のような一行は、
# 読んで感心して終わる。有益なアイデアには、いじる側面と最初の一歩が要る。
# material が入るテンプレートを既定にし、材料の無いテーマでは concept に
# フォールバックする。
#
# 各テンプレは needs で必要なプレースホルダを宣言する。

# **側面を名指ししない型は弱い。** 出力を型ごとに分けて読んで分かった:
# 「給水塔にあって放浪に無いものは何か」「連想と行列を同じ仕組みで扱えないか。
# 鍵は『全部公開する』こと」——どちらも何を比べているのか言っていないので、
# 読み手に全部の仕事を投げている。側面を入れると、比較の的が決まる。

templates:
  # --- 具体策 -------------------------------------------------------
  - id: swap_aspect
    tone: proposal
    needs: [material, aspect, operation_v, probe]
    text: "{material}の{aspect}を{operation_v}。まず{probe}。"

  - id: borrow_from
    tone: proposal
    needs: [material, concept_a, aspect, probe]
    text: "{concept_a}のやり方を{material}に持ち込む。見るのは{aspect}。まず{probe}。"

  # 外の世界の仕組みを、そのまま持ってくる。borrow_from は「やり方」と
  # 言うだけで中身を読み手に任せていた。こちらは一文を運ぶ。
  # 一文が主語を含むかどうかは採取元しだいなので、主語は括弧で添える。
  - id: mechanism_transfer
    tone: proposal
    needs: [material, mechanism]
    text: "{mechanism_how}（{mechanism}）。{material}で同じことをするなら、何が要るか。"

  - id: constrained_rebuild
    tone: proposal
    needs: [material, constraint, aspect, probe]
    text: "{constraint}{material}を作り直すとしたら、{aspect}はどうなるか。まず{probe}。"

  - id: remove_and_see
    tone: proposal
    needs: [material, aspect]
    text: "{material}から{aspect}を丸ごと取り除く。困る人がいれば、そこが本体。"

  - id: exaggerate
    tone: proposal
    needs: [material, aspect, operation]
    text: "{material}の{aspect}だけを極端にする。{operation}くらいまで。"

  - id: two_materials
    tone: proposal
    needs: [material, concept_a, aspect]
    text: "{material}と{concept_a}は、{aspect}だけ見れば同じではないか。"

  - id: for_one_person
    tone: proposal
    needs: [material, aspect]
    text: "いちばんヘビーに使う一人のためだけに{material}を作り直す。まず{aspect}が変わるはず。"

  # --- 問い ---------------------------------------------------------
  - id: question_aspect
    tone: question
    needs: [material, aspect, provocation]
    text: "{material}の{aspect}について——{provocation}。"

  - id: question_assumption
    tone: question
    needs: [material, aspect]
    text: "{material}の{aspect}は、なぜ今の形なのか。"

  # 疑問節専用。力関係と経緯を突く問い。名詞句の側面より刺さりやすい
  # 一方、動詞の目的語にはできないのでここに閉じ込める。
  - id: question_clause
    tone: question
    needs: [material, aspect_q]
    text: "{material}について、{aspect_q}。いま答えられるか。"

  - id: question_clause_probe
    tone: question
    needs: [material, aspect_q, probe]
    text: "{material}で{aspect_q}。まず{probe}。"

  - id: question_absence
    tone: question
    needs: [material, concept_a, aspect]
    text: "{material}の{aspect}を、{concept_a}のそれと並べてみる。無いものは何か。"

  - id: question_constrained
    tone: question
    needs: [material, constraint, provocation]
    text: "{constraint}{material}を扱うとする。{provocation}。"

  # --- 材料が無いとき（テーマ未登録）のフォールバック -----------------
  # 汎用の概念だけで作る。テーマがある場合よりどうしても浅くなる。
  - id: bare_collision
    tone: proposal
    needs: [concept_a, concept_b, aspect, probe]
    text: "{concept_a}のやり方を{concept_b}に持ち込む。見るのは{aspect}。まず{probe}。"

  # フォールバックにも operation を使う型を残す。これが無いと、テーマ未登録の
  # 間だけ operations プールが丸ごと死ぬ（テストが捕まえた）。
  - id: bare_swap
    tone: proposal
    needs: [concept_a, aspect, operation_v, probe]
    text: "{concept_a}の{aspect}を{operation_v}。何が変わるか。まず{probe}。"

  - id: bare_constrained
    tone: question
    needs: [concept_a, constraint, aspect]
    text: "{constraint}{concept_a}を作り直すとしたら、{aspect}はどうなるか。"

  - id: bare_question
    tone: question
    needs: [concept_a, aspect, provocation]
    text: "{concept_a}の{aspect}について——{provocation}。"
