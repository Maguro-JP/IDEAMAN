# テストと検査を毎回自動で走らせる。
#
# このリポジトリではこれまで、書いた本人が手で走らせたときだけ検査が
# 効いていた。走らせ忘れれば壊れたまま進む。人の記憶に頼らない。

name: check

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 動く下限（pyproject の requires-python）と、いま普通に使う版の両方。
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
        with:
          # コミットメッセージからも材料を集めるので、履歴が要る。
          # 浅いクローンだと収集のテストが実態と食い違う。
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: 依存を入れる（任意の依存も含めて全経路を通す）
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,bot,mcp]"

      - name: テスト
        run: pytest -q

      - name: 検査
        run: ruff check ideaman tests

  no-optional-deps:
    # 「キーが無くても、追加依存が無くても全機能が動く」という方針を守る。
    # 依存を入れた環境でしか通らないコードが混ざると、この方針は静かに崩れる。
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 本体の依存だけ入れる
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: discord.py と mcp が無い状態でテスト
        run: pytest -q
