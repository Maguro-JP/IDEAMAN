# テストと検査。
#
# **Actions の消費を抑える形にしてある。** 何も考えずに書くと、1回の push で
# push と pull_request の両方が起動し、さらにマトリクスとジョブ分割で
# 8ジョブ走る。実際そうなっていた。

name: check

on:
  # pull_request だけにする。PR ブランチへの push でも起動するので、
  # push トリガと併用すると同じコミットで二重に走る。
  pull_request:
  push:
    branches: [main]

# 続けて push したら、古い実行は止める。
concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # コミットメッセージからも材料を集めるので、履歴が要る。
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          # 宣言している下限。ここで通れば新しい版でも通る（新しい構文を
          # うっかり使っていれば、ここで落ちる）。
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      # 1つのジョブで両方の構成を見る。ジョブを分けるとランナーが増える。
      - name: 本体の依存だけ入れる
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: 追加依存が無い状態でテスト
        # 「キーが無くても追加依存が無くても全機能が動く」は Phase 1 からの
        # 方針。依存を入れた環境でしか通らないコードが混ざると静かに崩れる。
        run: pytest -q

      - name: 追加依存を入れる
        run: pip install -e ".[dev,bot,mcp]"

      - name: 全部入りでテスト
        run: pytest -q

      - name: 検査
        run: ruff check ideaman tests
